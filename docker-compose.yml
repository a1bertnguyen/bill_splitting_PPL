# ============================================================================
# SplitLang Docker Compose Stack (React/FastAPI App + MySQL 8.4)
#
# Usage:
#   docker compose up --build -d
#   Open http://127.0.0.1:8000
# ============================================================================

services:
  db:
    image: mysql:8.4
    container_name: splitlang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-splitlang_db}
      MYSQL_USER: ${MYSQL_USER:-splitlang_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/docker_init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - splitlang_internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitlang-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_BACKEND: mysql
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - splitlang_internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:

networks:
  splitlang_internal:
    driver: bridge
